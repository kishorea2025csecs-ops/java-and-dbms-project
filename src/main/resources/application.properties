# ==============================================================================
# ParkEase - Smart Parking Management System Configuration
# ==============================================================================
spring.application.name=ParkEase

# Server Port
server.port=8080

# ------------------------------------------------------------------------------
# MySQL 8 Configuration
# ------------------------------------------------------------------------------
# To connect to your local MySQL instance:
# 1. Open MySQL Workbench and create the database: CREATE DATABASE parkease_db;
# 2. Update the username and password below if different from root/root.
spring.datasource.url=jdbc:mysql://localhost:3306/parkease_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.parkease=INFO
logging.level.org.springframework.web=INFO

