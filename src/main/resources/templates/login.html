<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Login')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card border-0 shadow-lg" style="max-width: 440px; width: 100%; border-radius: 18px; overflow: hidden;">
    <div class="p-4 text-white text-center" style="background-color: var(--primary-navy);">
        <div class="brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 26px;">
            <i class="fas fa-parking"></i>
        </div>
        <h3 class="fw-bold mb-1">ParkEase</h3>
        <p class="text-secondary small mb-0">Smart Parking. Easy Management.</p>
    </div>

    <div class="card-body p-4 p-md-5">
        <h5 class="fw-bold mb-2 text-dark">Administrator Sign In</h5>
        <p class="text-muted small mb-4">Enter your administrative credentials to manage parking slots, tickets, and transactions.</p>

        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger py-2 small mb-3">
            <i class="fas fa-exclamation-circle me-1"></i>
            <span th:text="${error}">Invalid credentials</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-info py-2 small mb-3">
            <i class="fas fa-info-circle me-1"></i> You have been successfully logged out.
        </div>

        <form id="loginForm" th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" id="loginUsername" class="form-control" placeholder="admin" required value="admin">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" id="loginPassword" class="form-control" placeholder="admin123" required value="admin123">
                </div>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="p-3 bg-light rounded-3 text-center border">
            <div class="small text-muted fw-semibold mb-1">Academic Demo Credentials:</div>
            <div class="small text-dark mb-2">Username: <strong>admin</strong> &bull; Password: <strong>admin123</strong></div>
            <button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="quickFillAndSubmit()">
                <i class="fas fa-bolt text-warning me-1"></i> Auto Fill &amp; Sign In
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function quickFillAndSubmit() {
        document.getElementById('loginUsername').value = 'admin';
        document.getElementById('loginPassword').value = 'admin123';
        document.getElementById('loginForm').submit();
    }
</script>
</body>
</html>
